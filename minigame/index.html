<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy. Allows the pinned CDNs + our inline game loader
         + blob: URLs that p5.sound uses for its AudioWorklet. frame-ancestors
         is intentionally omitted here — meta tags don't honor it; have nginx
         send an X-Frame-Options: DENY header for real clickjacking protection. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" type="image/jpeg" href="src/images/chicken_toy.jpg">
    <title>MIMESIS — Event Challenge</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.min.js"
            integrity="sha384-icvcGshxtiNlCvhaQB4zAsO3dE3w3oXvkzQa8ioCvPabaH7ELUbKkDi/GPkLR3Wp"
            crossorigin="anonymous"></script>
    <script>
    // Polyfill: p5.sound 1.8.0 calls audioContext.audioWorklet.addModule(...) during
    // its addon init. On Chromium mobile, Firefox Android, and any browser where the
    // AudioContext hasn't been user-gesture-resumed yet, `audioWorklet` can be
    // undefined and p5.sound throws before our sketch ever runs. Stubbing the getter
    // with a no-op addModule keeps init alive; real AudioWorklet support (when
    // present) still works because we only install the stub when missing.
    (function () {
        if (typeof AudioContext === 'undefined') return;
        const proto = AudioContext.prototype;
        if ('audioWorklet' in proto) return;
        try {
            Object.defineProperty(proto, 'audioWorklet', {
                configurable: true,
                get() { return { addModule: () => Promise.resolve() }; },
            });
        } catch (e) {
            console.warn('audioWorklet polyfill failed:', e);
        }
    })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/addons/p5.sound.min.js"
            integrity="sha384-Ozi5ax1b+B/XBCzskytbAcQlgO0fcBp6gBOgS1SNQgR55vMk33RdVPAAAvB/8kA6"
            crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-overlay: rgba(16, 18, 34, 0.55);
            --card-bg: rgba(18, 20, 40, 0.78);
            --card-border: rgba(138, 180, 255, 0.18);
            --text-primary: #eef1ff;
            --text-muted: #a9b1d6;
            --accent: #74c7ec;
            --accent-strong: #89b4fa;
            --success: #a6e3a1;
            --danger: #f38ba8;
            --code-bg: #0b0d1f;
            --code-border: rgba(137, 180, 250, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-image: url('src/ui/BG.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(16, 18, 34, 0.35) 0%, rgba(16, 18, 34, 0.75) 100%);
            z-index: 1;
            pointer-events: none;
        }

        #menu-container, #game-canvas-container, #win-screen {
            position: relative;
            z-index: 2;
        }

        #menu-container {
            text-align: center;
            padding: 40px 32px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            width: min(92vw, 520px);
            backdrop-filter: blur(12px);
        }

        h1 {
            color: var(--text-primary);
            margin: 0 0 28px 0;
            font-size: clamp(1.6em, 4vw, 2.4em);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .game-button, .control-button {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 14px 18px;
            margin: 12px auto;
            font-size: 1.05em;
            font-weight: 600;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            background-color: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .game-button {
            background-image: url('src/ui/Button_02.webp');
            background-size: 100% 100%;
        }

        .game-button:hover:not(:disabled),
        .control-button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .game-button:active:not(:disabled),
        .control-button:active:not(:disabled) {
            transform: translateY(1px);
        }

        .game-button:disabled, .control-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #more-games-button { background: none; }

        #game-canvas-container {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 4px 24px rgba(0,0,0,0.35);
            border-radius: 8px;
        }

        /* Safety-net: force 16:9 on the game canvas even if JS sizing is cached stale */
        #game-canvas-container > canvas {
            aspect-ratio: 16 / 9;
            max-width: 88vw;
            max-height: 88vh;
        }

        #status-message {
            margin-top: 20px;
            color: var(--danger);
            font-weight: 500;
            font-size: 0.95em;
            line-height: 1.5;
        }

        /* ============================================================
           Win Screen
           ============================================================ */

        #win-screen {
            display: none;
            width: min(92vw, 560px);
            padding: 36px 32px 32px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            animation: winReveal 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        @keyframes winReveal {
            0%   { opacity: 0; transform: translateY(14px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0)    scale(1);    }
        }

        .win-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(166, 227, 161, 0.14);
            border: 1px solid rgba(166, 227, 161, 0.35);
            color: var(--success);
            border-radius: 999px;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        #win-title {
            margin: 14px 0 6px 0;
            font-size: clamp(1.6em, 3.5vw, 2.1em);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        #win-subtitle {
            margin: 0 0 24px 0;
            color: var(--text-muted);
            font-size: 0.98em;
            line-height: 1.55;
        }

        .code-block {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 18px;
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 12px;
            font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.95em;
            color: var(--accent);
            word-break: break-all;
            user-select: all;
            cursor: text;
        }

        #win-code {
            flex: 1;
            min-width: 0;
        }

        #copy-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 18px;
            margin-top: 14px;
            font-size: 1em;
            font-weight: 600;
            color: #0b0d1f;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        #copy-button:hover { background: #9bd8f0; }
        #copy-button:active { transform: translateY(1px); }
        #copy-button.copied { background: var(--success); }

        #copy-feedback {
            display: inline-block;
            margin-top: 10px;
            min-height: 1.2em;
            font-size: 0.88em;
            color: var(--success);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #copy-feedback.show { opacity: 1; }

        .win-steps {
            margin: 22px 0 0 0;
            padding: 16px 18px;
            background: rgba(137, 180, 250, 0.06);
            border-left: 3px solid var(--accent-strong);
            border-radius: 0 10px 10px 0;
            font-size: 0.92em;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .win-steps strong { color: var(--text-primary); }

        #ep-container {
            position: fixed;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            max-width: 900px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div id="menu-container">
        <h1>Choose Your Challenge</h1>
        <button id="play-hiding-game" class="game-button" disabled>Find Hiding Mimesis</button>
        <button id="play-pronunciation-game" class="game-button" disabled>Prove you are not a Mimesis</button>
        <button id="play-spot-difference-game" class="game-button" disabled>Spot the Difference</button>
        <button id="play-mimesis-pong-game" class="game-button" disabled>Mimesis Pong</button>
        <button id="play-cursed-rain-game" class="game-button" disabled>Cursed Rain</button>
        <button id="more-games-button" class="control-button mt-8">More games coming soon</button>
        <p id="status-message" style="display: none;"></p>
    </div>

    <div id="win-screen" role="dialog" aria-labelledby="win-title">
        <span id="win-badge" class="win-badge">✅ Completed</span>
        <h2 id="win-title">You won!</h2>
        <p id="win-subtitle">Here is your redeem code. It has been copied to your clipboard automatically.</p>
        <div id="code-block-wrap" class="code-block"><span id="win-code"></span></div>
        <button id="copy-button" type="button">📋 Copy code</button>
        <span id="copy-feedback"></span>
        <div id="win-steps" class="win-steps">
            <strong>Next:</strong> head back to the event post in Discord, click <strong>🎁 Redeem Code</strong>, and paste this code to get your role.
        </div>
        <div id="win-expiry" style="margin-top:10px; color:var(--danger); font-size:0.88em;"></div>
    </div>

    <div id="ep-container" class="hidden mt-4 p-3 bg-black bg-opacity-50 rounded-md text-left text-sm text-green-400 font-mono break-words whitespace-pre-wrap">
        <pre class="w-full"><code class="w-full"></code></pre>
    </div>

    <div id="game-canvas-container"></div>

    <script>
    (function() {
        const menuContainer      = document.getElementById('menu-container');
        const canvasContainer    = document.getElementById('game-canvas-container');
        const hidingButton       = document.getElementById('play-hiding-game');
        const pronunciationButton = document.getElementById('play-pronunciation-game');
        const spotDifferenceButton = document.getElementById('play-spot-difference-game');
        const mimesisPongButton = document.getElementById('play-mimesis-pong-game');
        const cursedRainButton = document.getElementById('play-cursed-rain-game');
        const statusMessage      = document.getElementById('status-message');
        const allGameButtons     = document.querySelectorAll('.game-button');
        const moreGamesButton    = document.getElementById('more-games-button');
        const winScreen          = document.getElementById('win-screen');
        const winCode            = document.getElementById('win-code');
        const winBadge           = document.getElementById('win-badge');
        const winTitle           = document.getElementById('win-title');
        const winSubtitle        = document.getElementById('win-subtitle');
        const winSteps           = document.getElementById('win-steps');
        const winExpiry          = document.getElementById('win-expiry');
        const codeBlockWrap      = document.getElementById('code-block-wrap');
        const copyButton         = document.getElementById('copy-button');
        const copyFeedback       = document.getElementById('copy-feedback');

        let loadedGameScript = null;
        let p5Instance = null;
        let codesBundle = null;      // { hiding: {1,2,3}, human: {1,2,3}, spot_the_difference: {1,2,3} }
        let expiresMinutes = null;
        let currentGameSalt = null;
        let currentCode = null;      // code displayed on win screen (so copy button copies the right one)
        let activeIframe = null;
        let activeIframeMessageHandler = null;

        const GAME_ID_ALIASES = {
            'hiding': 'hiding',
            'human': 'human',
            'spot_the_difference': 'spot_the_difference',
            'spot': 'spot_the_difference',
            'mimesis_pong': 'mimesis_pong',
            'pong': 'mimesis_pong',
            'cursed_rain': 'cursed_rain',
            'rain': 'cursed_rain',
        };

        const TIER_LABEL = {1: {name: 'Bronze', emoji: '🥉'}, 2: {name: 'Silver', emoji: '🥈'}, 3: {name: 'Gold', emoji: '🥇'}};

        function scoreToTier(score) {
            if (score >= 30) return 3;
            if (score >= 20) return 2;
            if (score >= 10) return 1;
            return 0;
        }

        function decodeBundle(raw) {
            try {
                const pad = '='.repeat((4 - raw.length % 4) % 4);
                const b64 = raw.replace(/-/g, '+').replace(/_/g, '/') + pad;
                return JSON.parse(atob(b64));
            } catch (e) {
                console.error("Failed to decode codes bundle", e);
                return null;
            }
        }

        function initializePage() {
            allGameButtons.forEach(button => button.disabled = true);

            const urlParams = new URLSearchParams(window.location.search);
            const codesFromUrl = urlParams.get('codes');
            const expFromUrl = urlParams.get('exp');

            if (codesFromUrl) {
                codesBundle = decodeBundle(codesFromUrl);
                if (codesBundle) sessionStorage.setItem('codesBundle', JSON.stringify(codesBundle));
            } else {
                const cached = sessionStorage.getItem('codesBundle');
                if (cached) {
                    try { codesBundle = JSON.parse(cached); } catch (e) { codesBundle = null; }
                }
            }

            if (expFromUrl) {
                expiresMinutes = parseInt(expFromUrl, 10) || null;
                if (expiresMinutes) sessionStorage.setItem('expiresMinutes', String(expiresMinutes));
            } else {
                const cachedExp = sessionStorage.getItem('expiresMinutes');
                if (cachedExp) expiresMinutes = parseInt(cachedExp, 10) || null;
            }

            if (!codesBundle) {
                statusMessage.textContent = "Please open this page from the Discord event post — click 🎮 Play the Game to get your personal link.";
                statusMessage.style.display = 'block';
                return;
            }

            const games = Object.keys(codesBundle);
            const validShape = games.length >= 1 && games.every(g =>
                codesBundle[g] && ['1','2','3'].every(t => typeof codesBundle[g][t] === 'string')
            );
            if (!validShape) {
                statusMessage.textContent = "This link looks invalid. Please click 🎮 Play the Game again in Discord.";
                statusMessage.style.display = 'block';
                return;
            }

            allGameButtons.forEach(button => button.disabled = false);
        }

        function showWinScreen(gameId, score) {
            menuContainer.style.display = 'none';
            canvasContainer.style.display = 'none';

            const tier = scoreToTier(score);
            const canonicalGame = GAME_ID_ALIASES[gameId] || gameId;

            if (tier === 0) {
                // Below bronze threshold — no code to give
                winBadge.textContent = '✖ Try again';
                winBadge.style.background = 'rgba(243, 139, 168, 0.14)';
                winBadge.style.borderColor = 'rgba(243, 139, 168, 0.35)';
                winBadge.style.color = 'var(--danger)';
                winTitle.textContent = `Score: ${score}`;
                winSubtitle.textContent = `You need at least 10 points to earn a Bronze role. Head back and click Play again to try once more.`;
                codeBlockWrap.style.display = 'none';
                copyButton.style.display = 'none';
                copyFeedback.style.display = 'none';
                winSteps.innerHTML = '<strong>Tip:</strong> Bronze 🥉 = score ≥10, Silver 🥈 = ≥20, Gold 🥇 = ≥30.';
                winExpiry.textContent = '';
                winScreen.style.display = 'block';
                currentCode = null;
                return;
            }

            const code = codesBundle[canonicalGame] && codesBundle[canonicalGame][String(tier)];
            if (!code) {
                statusMessage.textContent = `Could not find a code for game "${canonicalGame}". Please reload from Discord.`;
                statusMessage.style.display = 'block';
                winScreen.style.display = 'none';
                menuContainer.style.display = 'block';
                return;
            }

            currentCode = code;
            const tierInfo = TIER_LABEL[tier];
            winBadge.textContent = `${tierInfo.emoji} ${tierInfo.name} tier`;
            winBadge.style.background = '';
            winBadge.style.borderColor = '';
            winBadge.style.color = '';
            winTitle.textContent = `You won! (score: ${score})`;
            winSubtitle.textContent = `Here is your redeem code. It has been copied to your clipboard automatically.`;
            codeBlockWrap.style.display = '';
            copyButton.style.display = '';
            copyFeedback.style.display = '';
            winSteps.innerHTML = '<strong>Next:</strong> head back to the event post in Discord, click <strong>🎁 Redeem Code</strong>, and paste this code to get your role.';
            winCode.textContent = code;

            if (expiresMinutes) {
                winExpiry.textContent = `⏱ This code is valid for ${expiresMinutes} minutes from when you clicked Play. Redeem soon.`;
            } else {
                winExpiry.textContent = '';
            }

            winScreen.style.display = 'block';
            copyToClipboard(code, /*silent=*/true);
        }

        async function copyToClipboard(text, silent) {
            let ok = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    ok = true;
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                }
            } catch (err) {
                console.warn("Clipboard copy failed:", err);
                ok = false;
            }

            if (!silent || ok) {
                if (ok) {
                    copyFeedback.textContent = "✓ Copied to clipboard";
                    copyFeedback.classList.add('show');
                    copyButton.classList.add('copied');
                    copyButton.innerHTML = '✓ Copied!';
                    setTimeout(() => {
                        copyButton.classList.remove('copied');
                        copyButton.innerHTML = '📋 Copy code';
                        copyFeedback.classList.remove('show');
                    }, 2000);
                } else if (!silent) {
                    copyFeedback.textContent = "Couldn't copy automatically — select the code above and copy manually.";
                    copyFeedback.style.color = 'var(--danger)';
                    copyFeedback.classList.add('show');
                }
            }
            return ok;
        }

        copyButton.addEventListener('click', () => {
            if (currentCode) copyToClipboard(currentCode, false);
        });

        function cleanupPreviousGame() {
            if (p5Instance) {
                if (typeof p5Instance.cleanup === 'function') p5Instance.cleanup();
                if (typeof p5Instance.remove === 'function') p5Instance.remove();
                p5Instance = null;
            }
            if (loadedGameScript && loadedGameScript.parentNode) {
                loadedGameScript.parentNode.removeChild(loadedGameScript);
                loadedGameScript = null;
            }
            if (activeIframeMessageHandler) {
                window.removeEventListener('message', activeIframeMessageHandler);
                activeIframeMessageHandler = null;
            }
            activeIframe = null;
            currentGameSalt = null;
            sessionStorage.removeItem('currentGameSalt');

            canvasContainer.innerHTML = '';
            canvasContainer.style.display = 'none';
            if (winScreen.style.display !== 'block') {
                menuContainer.style.display = 'block';
            }
        }
        window.cleanupPreviousGame = cleanupPreviousGame;

        function loadGame(scriptPath, sketchFunctionName) {
            cleanupPreviousGame();

            currentGameSalt = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            sessionStorage.setItem('currentGameSalt', currentGameSalt);

            menuContainer.style.display = 'none';
            canvasContainer.style.display = 'flex';

            const gameScript = document.createElement('script');
            gameScript.src = scriptPath + '?v=' + Date.now();
            gameScript.defer = true;
            gameScript.onload = () => {
                if (typeof window[sketchFunctionName] === 'function') {
                    try {
                        p5Instance = new p5(window[sketchFunctionName], 'game-canvas-container');
                    } catch (err) {
                        console.error("Error creating p5 instance:", err);
                        cleanupPreviousGame();
                    }
                } else {
                    console.error(`Sketch function '${sketchFunctionName}' not found.`);
                    cleanupPreviousGame();
                }
            };
            gameScript.onerror = (err) => {
                console.error(`Failed to load script: ${scriptPath}`, err);
                cleanupPreviousGame();
            };
            document.body.appendChild(gameScript);
            loadedGameScript = gameScript;
        }

        // ------------------------------------------------------------------
        // Iframe-based game loader (used for CURSED RAIN, which is a standalone
        // Vite/TS build rather than a p5 sketch).
        //
        // Hand-off contract with the child page:
        //   parent → iframe: { type: 'init', salt }            (after iframeReady)
        //   iframe → parent: { type: 'iframeReady' }           (sent on boot)
        //   iframe → parent: { type: 'gameComplete', detail }  (sent on game-over)
        //
        // We re-dispatch gameComplete as a CustomEvent so the existing
        // window.gameComplete listener below handles win-screen flow identically
        // to the p5 games.
        // ------------------------------------------------------------------
        function loadIframeGame(path) {
            cleanupPreviousGame();

            currentGameSalt = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            sessionStorage.setItem('currentGameSalt', currentGameSalt);

            menuContainer.style.display = 'none';
            canvasContainer.style.display = 'flex';

            // Forward the codes bundle + expiry to the iframe via its own URL —
            // the child's MimesisShell parses them the same way this page does.
            const codesB64 = btoa(JSON.stringify(codesBundle))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const expQuery = expiresMinutes ? `&exp=${expiresMinutes}` : '';
            const url = `${path}?codes=${codesB64}${expQuery}`;

            // Mobile/portrait phones: the iframe fills the entire viewport so
            // the player can swipe anywhere on the screen to control the game
            // (TouchInput inside the iframe listens on window). Desktop/landscape
            // keeps the centered, letterboxed cabinet look used by the p5 games.
            const isMobile = window.matchMedia('(max-width: 820px), (orientation: portrait)').matches;
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.id = 'game-iframe';
            iframe.setAttribute('allow', 'autoplay; gamepad');
            iframe.style.cssText = isMobile ? [
                'position: fixed',
                'inset: 0',
                'width: 100vw',
                'height: 100vh',
                'border: none',
                'background: #000',
                'z-index: 1000'
            ].join('; ') : [
                'width: min(88vw, calc(88vh * 4 / 3))',
                'height: min(88vh, calc(88vw * 3 / 4))',
                'border: none',
                'border-radius: 8px',
                'box-shadow: 0 4px 24px rgba(0,0,0,0.35)',
                'background: #000'
            ].join('; ');
            canvasContainer.appendChild(iframe);
            activeIframe = iframe;

            activeIframeMessageHandler = (event) => {
                // Only trust messages from our iframe's contentWindow.
                if (!activeIframe || event.source !== activeIframe.contentWindow) return;
                const msg = event.data;
                if (!msg || typeof msg !== 'object') return;

                if (msg.type === 'iframeReady') {
                    // Iframe booted — send it the salt so it can echo it back on game-over.
                    activeIframe.contentWindow.postMessage(
                        { type: 'init', salt: currentGameSalt },
                        '*'
                    );
                } else if (msg.type === 'gameComplete') {
                    // Re-dispatch as a CustomEvent so the existing handler picks it up.
                    window.dispatchEvent(new CustomEvent('gameComplete', { detail: msg.detail }));
                }
            };
            window.addEventListener('message', activeIframeMessageHandler);
        }

        const gameButtons = document.querySelectorAll('.game-button');
        const hoverFrames = [
            'src/ui/Line0000.webp', 'src/ui/Line0001.webp', 'src/ui/Line0002.webp',
            'src/ui/Line0003.webp', 'src/ui/Line0004.webp', 'src/ui/Line0005.webp'
        ];
        const pressedButtonImg = 'url("src/ui/Button_01.webp")';

        gameButtons.forEach(button => {
            let hoverInterval = null;

            button.addEventListener('mouseenter', () => {
                if (button.disabled || button.matches(':active')) return;
                let frameIndex = 0;
                hoverInterval = setInterval(() => {
                    button.style.backgroundImage = `url('${hoverFrames[frameIndex]}'), url('src/ui/Button_02.webp')`;
                    button.style.backgroundSize = '150%, 100%';
                    button.style.backgroundPosition = 'center, center';
                    frameIndex = (frameIndex + 1) % hoverFrames.length;
                }, 100);
            });

            const stopHover = () => {
                if (hoverInterval) clearInterval(hoverInterval);
                hoverInterval = null;
                button.style.backgroundImage = '';
                button.style.backgroundSize = '';
                button.style.backgroundPosition = '';
            };

            button.addEventListener('mouseleave', stopHover);
            button.addEventListener('mousedown', () => {
                if (button.disabled) return;
                stopHover();
                button.style.backgroundImage = pressedButtonImg;
            });
            button.addEventListener('mouseup', () => {
                if (button.disabled) return;
                button.style.backgroundImage = '';
                if (button.matches(':hover')) {
                    button.dispatchEvent(new Event('mouseenter'));
                }
            });
        });

        window.addEventListener('gameComplete', function(event) {
            const { gameId, score, salt } = event.detail;

            if (!salt || salt !== currentGameSalt) {
                console.error("Invalid game salt — refusing to reveal code.", { expected: currentGameSalt, received: salt });
                alert("Session mismatch. Please reload from the Discord link and try again.");
                cleanupPreviousGame();
                return;
            }

            if (!codesBundle) {
                alert("No redeem codes are attached to this session. Please reload from Discord.");
                cleanupPreviousGame();
                return;
            }

            if (typeof score !== 'number' || isNaN(score) || score < 0) {
                console.error("Invalid score on gameComplete:", event.detail);
                alert("Score validation failed. Please reload from Discord and try again.");
                cleanupPreviousGame();
                return;
            }

            currentGameSalt = null;
            sessionStorage.removeItem('currentGameSalt');

            showWinScreen(gameId, score);
        });

        function toggleEpCode() {
            const epContainer = document.getElementById('ep-container');
            if (!epContainer) return;

            const codeElement = epContainer.querySelector('code');
            const epCode = `++++++++[>++++++++<-]>++.
+++++++++++++++++++++++++++++++++++++++++++++.
-----------.
+++++++++++++++++++++.
---------------------------------------------------------------.
--------------------------.
++++++++++++++++++++++++++++++++++++.
+++++++++++++++++++++++++++++++++++++.
++++++++++.
----------------.
++++++++++++.
+++.
--------------.
--------------------------------------------------------------------.
+++++++++++++++++++++++++++++++++++++++++.
-----.`;

            const isHidden = epContainer.classList.contains('hidden');
            if (isHidden) {
                if(codeElement) codeElement.textContent = epCode;
                epContainer.classList.remove('hidden');
            } else {
                epContainer.classList.add('hidden');
            }
        }

        hidingButton.addEventListener('click', () => loadGame('find_hiding_ori.js', 'sketchFindHidingGame'));
        pronunciationButton.addEventListener('click', () => loadGame('pronunciation_game.js', 'sketchPronunciationGame'));
        spotDifferenceButton.addEventListener('click', () => loadGame('spotdifference.js', 'sketchSpotTheDifference'));
        mimesisPongButton.addEventListener('click', () => loadGame('mimesis_pong.js', 'sketchMimesisPong'));
        // CURSED RAIN ships as a built dist/ under minigame/cursed_rain/ — load it in an iframe.
        cursedRainButton.addEventListener('click', () => loadIframeGame('cursed_rain/index.html'));

        if (moreGamesButton) {
            moreGamesButton.disabled = false;
            moreGamesButton.addEventListener('click', toggleEpCode);
        }

        const epContainer = document.getElementById('ep-container');
        if (epContainer) {
            epContainer.addEventListener('click', () => epContainer.classList.add('hidden'));
        }

        window.addEventListener('resize', () => {
            if (p5Instance && typeof p5Instance.windowResized === 'function') {
                p5Instance.windowResized();
            }
        });

        window.onload = initializePage;
    })();
    </script>
</body>
</html>
